name: khata_plus
description: "KhataPlus — a shopkeeper's notebook, digitised. A Flutter digital ledger (khata) app: customers, credit (udhaar) and payment entries, live balances, search and a daily summary. Data stays on the device."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
